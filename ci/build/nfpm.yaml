name: "shrinking-server"
arch: "${NFPM_ARCH}"
platform: "linux"
version: "v${VERSION}"
section: "devel"
priority: "optional"
maintainer: "xgauravyaduvanshii <xgauravyaduvanshii@gmail.com>"
description: |
  Run shrinking-server in the browser.
vendor: "xgauravyaduvanshii"
homepage: "https://github.com/xgauravyaduvanshii/shrinking-server"
license: "MIT"

contents:
  - src: ./ci/build/code-server-nfpm.sh
    dst: /usr/bin/code-server

  - src: ./ci/build/code-server@.service
    dst: /usr/lib/systemd/system/code-server@.service

  - src: ./ci/build/code-server-user.service
    dst: /usr/lib/systemd/user/code-server.service

  - src: ./release/*
    dst: /usr/lib/code-server
